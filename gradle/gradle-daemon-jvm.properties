#
# Gradle Daemon JVM criteria.
#
# Pinning the daemon to JDK 25 here means contributors no longer have
# to remember to set JAVA_HOME before every build. Gradle will
# auto-discover an installed JDK 25 (Adoptium / Liberica / Microsoft
# Build of OpenJDK / SAPMachine / Oracle / etc.) via its standard
# detection paths.
#
toolchainVersion=25
