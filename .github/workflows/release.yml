name: Release

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build mods 26.2 / 26.3 / 1.21.11
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: ./gradlew build --no-daemon
      - name: Upload jars
        uses: actions/upload-artifact@v4
        with:
          name: jars
          path: build/libs/mine-canvas-fabric-*.jar
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Download jars
        uses: actions/download-artifact@v4
        with:
          name: jars
          path: dist
      - name: Collect release assets
        run: |
          set -euo pipefail
          mkdir -p release
          cp dist/*.jar release/
          VERSION="$(basename "$(ls dist/mine-canvas-fabric-*-mc1.21.11.jar | head -n1)" .jar)"
          VERSION="${VERSION#mine-canvas-fabric-}"
          VERSION="${VERSION%-mc1.21.11}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          ls -l release
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: Mine-canvas mod ${{ env.VERSION }}
          body: |
            **Установка**
            - `mine-canvas-fabric-*-mc26.3.jar` -> `mods/` — мод для клиента Minecraft 26.3
            - `mine-canvas-fabric-*-mc26.2.jar` -> `mods/` — мод для клиента Minecraft 26.2
            - `mine-canvas-fabric-*-mc1.21.11.jar` -> `mods/` — мод для клиента Minecraft 1.21.11
            Для 26.3 нужны Fabric Loader >= 0.19.5 и Fabric API >= 0.161.0; для 26.2 — Fabric Loader >= 0.18.4 и Fabric API >= 0.156.0; для 1.21.11 — Fabric Loader >= 0.17.3 и Fabric API 0.141.6+1.21.11. Mod Menu необязателен, но рекомендуется (для 26.3 доступен только prerelease 21.0.0-beta.1). Серверный плагин ставится отдельно (`mine-canvas-paper-*.jar` -> `plugins/`).
          files: release/*.jar
          fail_on_unmatched_files: true
